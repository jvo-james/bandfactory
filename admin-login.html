<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band Factory Admin Sign In</title><meta name="description" content="Private Band Factory admin sign in.">
   <link rel="icon" href="logo.jpg">
  <link rel="stylesheet" href="style.css"><style>body{min-height:100dvh;background:linear-gradient(135deg,#fff 0 42%,#ffeaf1 42% 100%);display:grid;place-items:center;padding:20px}.login-shell{width:min(960px,100%);min-height:560px;background:#fff;box-shadow:0 30px 90px rgba(25,15,18,.14);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.login-art{background:#111;color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.login-art:after{content:'';position:absolute;width:390px;height:390px;border-radius:50%;background:#f4b6ca;right:-180px;bottom:-180px}.login-art h1{font-family:var(--serif);font-size:62px;line-height:.9;margin:0;position:relative;z-index:1}.login-form{padding:56px;display:flex;flex-direction:column;justify-content:center}.login-form h2{font-family:var(--serif);font-size:44px;margin:0 0 8px}.login-form p{color:var(--muted);margin:0 0 28px}.error{display:none;background:#fff0f2;color:#8b2946;padding:12px;font-size:12px;margin-bottom:16px}.login-form .btn{width:100%;margin-top:6px}.login-help{display:flex;justify-content:flex-end;margin-top:9px}.login-help button{border:0;background:transparent;padding:3px 0;color:#7b6870;font:inherit;font-size:10px;text-decoration:underline;cursor:pointer}.login-note{display:none;margin-top:12px;padding:10px 12px;border-radius:9px;background:#effaf4;color:#267a4b;font-size:10px;line-height:1.45}@media(max-width:720px){body{padding:0;background:#fff}.login-shell{min-height:100dvh;display:block;box-shadow:none}.login-art{min-height:220px;padding:30px}.login-art h1{font-size:48px}.login-form{padding:34px 22px}.login-form h2{font-size:40px}}</style><link rel="canonical" href="https://bandfactory.store/admin-login.html"><meta name="robots" content="noindex,follow"></head><body><main class="login-shell"><section class="login-art"><a class="brand brand-with-logo" href="index.html" style="text-align:left" aria-label="Band Factory home"><img src="images/brand-monogram.jpg" alt=""><span>BΛND<small>FΛCTORY</small></span></a><div><div class="eyebrow" style="color:#f4b6ca">Store control centre</div><h1>Run the brand<br>from anywhere.</h1></div></section><section class="login-form"><h2>Welcome back.</h2><p>Sign in the email address provided.</p><div class="error" id="loginError"></div><form id="loginForm"><div class="form-group"><label>Email</label><input class="field" type="email" name="email" required autocomplete="email"></div><div class="form-group"><label>Password</label><input class="field" type="password" name="password" required autocomplete="current-password"></div><button class="btn">Sign in to admin</button><div class="login-help"><button type="button" id="forgotPassword">Forgot password?</button></div><div class="login-note" id="loginNote"></div></form><a href="index.html" style="margin-top:18px;font-size:11px">← Back to store</a></section></main><script src="config.js"></script><script src="firebase.js"></script><script>
const loginForm=document.getElementById('loginForm'),loginError=document.getElementById('loginError'),loginNote=document.getElementById('loginNote');
loginForm.onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('.btn');b.disabled=true;b.textContent='Signing in...';loginError.style.display='none';loginNote.style.display='none';try{await BFStore.signIn(f.email.value,f.password.value);const a=await BFStore.currentAdmin();if(!a){await BFStore.signOut();throw new Error('This account is not authorized as a Band Factory admin.')}location.href='admin.html'}catch(x){loginError.textContent=x.message;loginError.style.display='block'}finally{b.disabled=false;b.textContent='Sign in to admin'}};
document.getElementById('forgotPassword').onclick=async()=>{const email=loginForm.email.value.trim();loginError.style.display='none';loginNote.style.display='none';if(!email){loginError.textContent='Enter the admin email address first, then tap Forgot password.';loginError.style.display='block';loginForm.email.focus();return}const button=document.getElementById('forgotPassword');button.disabled=true;button.textContent='Sending…';try{await BFStore.sendPasswordReset(email);loginNote.textContent=`Password reset email sent to ${email}. Check the inbox and follow the link.`;loginNote.style.display='block'}catch(x){loginError.textContent=x.message;loginError.style.display='block'}finally{button.disabled=false;button.textContent='Forgot password?'}};
BFStore.onAuth(a=>{if(a)location.href='admin.html'});
</script></body></html>
